<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'SF Mono','Fira Code','Cascadia Code','Consolas',monospace">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="20" y="20" width="680" height="380" rx="10" fill="url(#termBg)" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="680" height="40" rx="10" fill="url(#titleBar)"/>
  <rect x="20" y="40" width="680" height="20" fill="url(#titleBar)"/>
  
  <!-- Window buttons -->
  <circle cx="48" cy="40" r="7" fill="#ff5f57"/>
  <circle cx="70" cy="40" r="7" fill="#fdbc40"/>
  <circle cx="92" cy="40" r="7" fill="#33c748"/>
  
  <!-- Title -->
  <text x="360" y="45" text-anchor="middle" fill="#888" font-size="13" font-weight="600">factum-fic elabora</text>
  
  <!-- Prompt line 1 -->
  <text x="40" y="95" fill="#7aa2f7" font-size="14">$</text>
  <text x="58" y="95" fill="#c0caf5" font-size="14">factum-fic elabora</text>
  
  <!-- Divider -->
  <text x="40" y="125" fill="#565f89" font-size="14">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  
  <!-- Processing file -->
  <text x="40" y="155" fill="#9ece6a" font-size="14">📂</text>
  <text x="62" y="155" fill="#565f89" font-size="14">Elaborazione file in</text>
  <text x="210" y="155" fill="#c0caf5" font-size="14">./da_elaborare/</text>
  
  <text x="40" y="185" fill="#89ddff" font-size="14">⋮</text>
  
  <!-- XML file -->
  <text x="55" y="215" fill="#9ece6a" font-size="14">✅</text>
  <text x="78" y="215" fill="#c0caf5" font-size="14">Hetzner_2026-07.xml</text>
  
  <text x="330" y="215" fill="#565f89" font-size="13">→ SDI XML parsed (locale, zero LLM)</text>
  <text x="330" y="235" fill="#a9b1d6" font-size="13">→ Spesa registrata su FIC</text>
  <text x="50" y="255" fill="#73daca" font-size="13">✅ Autofattura TD17 generata (id=430594827)</text>
  
  <!-- PDF file -->
  <text x="55" y="285" fill="#9ece6a" font-size="14">✅</text>
  <text x="78" y="285" fill="#c0caf5" font-size="14">Hetzner_2026-07.pdf</text>
  <text x="330" y="285" fill="#a9b1d6" font-size="13">→ Spesa registrata su FIC (id=430594826)</text>
  
  <!-- Summary -->
  <text x="40" y="320" fill="#565f89" font-size="14">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  
  <text x="40" y="350" fill="#89ddff" font-size="14">📊</text>
  <text x="62" y="350" fill="#c0caf5" font-size="14">Riepilogo:</text>
  <text x="155" y="350" fill="#9ece6a" font-size="14">2 elaborate,</text>
  <text x="305" y="350" fill="#73daca" font-size="14">1 autofattura,</text>
  <text x="455" y="350" fill="#ff757f" font-size="14">0 errori</text>
  
  <!-- Cursor blink -->
  <rect x="570" y="338" width="2" height="16" fill="#c0caf5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>