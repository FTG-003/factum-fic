# CI — Ruff lint + pytest suite
#
# Si attiva su ogni push (qualsiasi branch) e su ogni PR verso main.
# Blocca il merge se lint o test falliscono.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q --tb=short
        env:
          FACTUM_API_URL: https://api.factum.pyragogy.org
          FACTUM_API_KEY: ${{ secrets.FACTUM_API_KEY }}
          FIC_BASE_URL: https://api-v2.fattureincloud.it
          FIC_API_KEY: ${{ secrets.FIC_API_KEY }}
          FIC_COMPANY_ID: ${{ secrets.FIC_COMPANY_ID }}